# =============================================================================
# values.yaml — valeurs du chart podinfo
# =============================================================================
# Point de départ MINIMAL. Vous l'enrichirez au fil des étapes de l'atelier
# (message/couleur de l'UI à l'étape 4, HPA à l'étape 6, etc.).
#
# Au départ, seules l'image et le nombre de répliques sont définis.
# =============================================================================

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.7.1"
  pullPolicy: IfNotPresent

replicaCount: 1

ui:
  message: "Bienvenue a l'atelier GitOps !"
  color: "#d97706"

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
